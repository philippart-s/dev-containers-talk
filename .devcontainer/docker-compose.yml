version: '3.8'
services:
  devcontainer:
    image: 95y036e0.gra7.container-registry.ovh.net/library/dev-container-talk:1.1.0
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres